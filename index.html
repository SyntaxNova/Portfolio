  <body class="bg-[#07090e] text-slate-100 antialiased selection:bg-indigo-500/30 selection:text-white overflow-x-hidden">
    <!-- MANDATORY: Purely decorative visual scroll progress bar with aria-hidden="true" per modern-web-guidance -->
    <div id="scroll-progress" aria-hidden="true"></div>

    <div id="root"></div>

    <!-- Modern Web Guidance Fallback for browsers without animation-timeline: scroll() -->
    <script>
      (function() {
        if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches && (!window.CSS || !CSS.supports('animation-timeline', 'scroll()'))) {
          const progress = document.getElementById('scroll-progress');
          if (progress) {
            window.addEventListener('scroll', () => {
              const scrollable = document.documentElement.scrollHeight - window.innerHeight;
              if (scrollable > 0) {
                const scrolled = window.scrollY;
                progress.style.transform = `scaleX(${scrolled / scrollable})`;
              }
            }, { passive: true });
          }
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
